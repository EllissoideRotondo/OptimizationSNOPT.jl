name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: [self-hosted, linux, x64, deimos, snopt]
    env:
      SNOPTDIR: /usr/lib
      GIT_EXEC_PATH: /home/alex/.local/runner-git/usr/libexec/git-core
    defaults:
      run:
        working-directory: OptimizationSNOPT
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - name: Add user git
        working-directory: ${{ github.workspace }}
        run: echo "/home/alex/.local/runner-git/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          path: OptimizationSNOPT
      - uses: actions/checkout@v4
        with:
          repository: EllissoideRotondo/SNOPT.jl
          path: SNOPT
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install documentation dependencies
        run: >-
          julia --project=docs -e
          'using Pkg; Pkg.develop(path="../SNOPT");
          Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
