name: CI

# Run on pushes to any branch in this repo. Only collaborators can push branches
# here, so this covers all branches you own while excluding external pull requests.
on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} / OptimizationSNOPT
    runs-on: [self-hosted, linux, x64, deimos, snopt]
    env:
      SNOPTDIR: /usr/lib
      GIT_EXEC_PATH: /home/alex/.local/runner-git/usr/libexec/git-core
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - name: Add user git
        run: echo "/home/alex/.local/runner-git/usr/bin" >> "$GITHUB_PATH"
      # Develop the sibling explicitly because Julia 1.10 ignores [sources].
      - uses: actions/checkout@v4
        with:
          path: OptimizationSNOPT
      - uses: actions/checkout@v4
        with:
          repository: EllissoideRotondo/SNOPT.jl
          path: SNOPT
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate and test
        run: julia --project=OptimizationSNOPT -e 'using Pkg; Pkg.develop(path="SNOPT"); Pkg.instantiate(); Pkg.test("OptimizationSNOPT")'
